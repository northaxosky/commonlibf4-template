name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: msvc
            mode: debug
            full: false
          - toolchain: msvc
            mode: releasedbg
            full: true
          - toolchain: clang-cl
            mode: debug
            full: false
          - toolchain: clang-cl
            mode: releasedbg
            full: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.1'

      - name: Verify
        shell: pwsh
        run: |
          $arguments = @{
            Toolchain = '${{ matrix.toolchain }}'
            Mode = '${{ matrix.mode }}'
          }
          if ('${{ matrix.full }}' -eq 'true') {
            $arguments.Full = $true
          }
          ./scripts/verify.ps1 @arguments
